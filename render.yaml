# Render Blueprint — Web Service + настройки сборки
services:
  - type: web
    name: pdn-registry
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        value: https://pdn-registry.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pdn-database
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: pdn-database
    plan: free
    region: frankfurt
